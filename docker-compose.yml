services:
  app:
    build:
      context: .
      target: development
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command: sh -c "find /app/node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + && npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
