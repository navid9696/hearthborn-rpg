services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hearthborn
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hearthborn
    depends_on:
      - db
    command: sh -c "npm ci && npx prisma generate && npx prisma db push && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
  backend_node_modules:
  pgdata:
